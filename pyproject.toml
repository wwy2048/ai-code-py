[project]
name = "ai-code-py"
version = "0.1.0"
description = "Python rewrite of the ai-code platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiomysql>=0.2.0,<1",
    "alembic>=1.14,<2",
    "anthropic>=0.70,<1",
    "argon2-cffi>=23.1,<26",
    "cos-python-sdk-v5>=1.9,<2",
    "cryptography>=43,<47",
    "fastapi>=0.115,<1",
    "pydantic-settings>=2.7,<3",
    "redis>=5.2,<7",
    "selenium>=4.27,<5",
    "sqlalchemy[asyncio]>=2.0.36,<3",
    "uvicorn[standard]>=0.32,<1",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.20,<1",
    "asgi-lifespan>=2.1,<3",
    "fakeredis>=2.26,<3",
    "httpx>=0.28,<1",
    "mypy>=1.14,<2",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<1",
    "ruff>=0.8,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple"
default = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
warn_unreachable = true
